<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b7cfa">
<title>天气助手</title>
<style>
  :root{
    --bg1:#e8edff; --bg2:#f6f0ff;
    --card:#ffffff; --text:#1f2430; --muted:#6b7385;
    --primary:#5b7cfa; --primary-2:#8a6bfa;
    --line:#e6e9f2; --ok:#22a06b; --warn:#e08a00; --bad:#d9534f;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 60%,#fff);
    min-height:100vh; padding:16px 14px 40px;
  }
  .wrap{max-width:520px;margin:0 auto}
  h1{font-size:20px;margin:6px 2px 2px;letter-spacing:.5px}
  .date{color:var(--muted);font-size:13px;margin:0 2px 14px}
  .search{display:flex;gap:8px;margin-bottom:14px}
  .search input{
    flex:1;border:1px solid var(--line);background:#fff;border-radius:14px;
    padding:13px 14px;font-size:15px;outline:none;color:var(--text);
  }
  .search input:focus{border-color:var(--primary)}
  .search button{
    border:none;border-radius:14px;padding:0 20px;font-size:15px;color:#fff;font-weight:600;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
  }
  .search button:active{opacity:.85}
  .card{
    background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;
    box-shadow:0 6px 20px rgba(60,80,160,.08);
  }
  .current{
    background:linear-gradient(135deg,#6b8cff,#9b6bff);color:#fff;
    box-shadow:0 10px 26px rgba(107,124,255,.35);
  }
  .current .row1{display:flex;align-items:center;justify-content:space-between}
  .current .city{font-size:15px;opacity:.92}
  .current .mood{font-size:13px;opacity:.85;margin-top:2px}
  .icon{font-size:54px;line-height:1}
  .temp{font-size:40px;font-weight:700;letter-spacing:-1px}
  .temp small{font-size:16px;font-weight:500;opacity:.85}
  .badge{
    display:inline-block;margin-top:10px;padding:4px 10px;border-radius:999px;
    background:rgba(255,255,255,.22);font-size:12px;
  }
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .item{padding:10px 12px;border-radius:12px;background:#f7f8fc}
  .item .k{font-size:12px;color:var(--muted)}
  .item .v{font-size:15px;font-weight:600;margin-top:3px}
  h2{font-size:15px;margin:0 0 10px}
  .line{display:flex;justify-content:space-between;align-items:center;
    padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .line:last-child{border-bottom:none}
  .line .d{color:var(--muted);width:96px;flex:none}
  .line .w{flex:1;text-align:center;font-weight:600}
  .line .t{width:108px;text-align:right;color:var(--muted)}
  .advice{margin:10px 0 0;padding:12px;border-radius:12px;background:#f7f8fc;font-size:14px;line-height:1.6}
  .advice b{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
  .tip{color:var(--muted);font-size:13px;line-height:1.6;margin-top:10px}
  .err{color:var(--bad);font-size:14px;margin:8px 0}
  .loading{color:var(--muted);font-size:14px;padding:20px 0;text-align:center}
  .empty{display:none}
  .section-title{font-size:14px;color:var(--muted);margin:2px 4px 8px}
  footer{color:#9aa1b4;font-size:12px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>天气助手</h1>
  <p class="date" id="today"></p>

  <div class="search">
    <input id="city" placeholder="输入城市，如 杭州" autocomplete="off">
    <button id="go">查询</button>
  </div>

  <div id="msg"></div>

  <div id="result" class="empty">
    <div class="card current">
      <div class="row1">
        <div>
          <div class="city" id="curCity"></div>
          <div class="mood" id="curArea"></div>
        </div>
        <div class="icon" id="curIcon"></div>
      </div>
      <div class="temp" id="curTemp"></div>
      <div class="badge" id="curCond"></div>
    </div>

    <div class="card">
      <div class="grid">
        <div class="item"><div class="k">天气等级</div><div class="v" id="level"></div></div>
        <div class="item"><div class="k">温度分类</div><div class="v" id="cat"></div></div>
        <div class="item"><div class="k">风向风速</div><div class="v" id="wind"></div></div>
        <div class="item"><div class="k">空气质量</div><div class="v" id="aqi"></div></div>
        <div class="item"><div class="k">日出</div><div class="v" id="sunrise"></div></div>
        <div class="item"><div class="k">日落</div><div class="v" id="sunset"></div></div>
      </div>
    </div>

    <div class="card">
      <h2>穿衣建议</h2>
      <div class="advice" id="cloth"></div>
      <div class="advice"><b>出行建议</b><span id="travel"></span></div>
      <div class="tip" id="tips"></div>
    </div>

    <div class="card">
      <h2>未来 7 天</h2>
      <div id="future"></div>
    </div>

    <div class="card">
      <h2>过去 7 天</h2>
      <div id="past"></div>
    </div>
  </div>

  <footer>数据来源：Open-Meteo（免费，无需 key）</footer>
</div>

<script>
const WMO = {0:"晴",1:"晴",2:"多云",3:"阴",45:"雾",48:"雾",51:"小雨",53:"小雨",55:"小雨",
  56:"冻雨",57:"冻雨",61:"小雨",63:"中雨",65:"大雨",66:"冻雨",67:"冻雨",
  71:"小雪",73:"中雪",75:"大雪",77:"雪",80:"小雨",81:"中雨",82:"暴雨",
  85:"中雪",86:"大雪",95:"雷阵雨",96:"冰雹",99:"冰雹"};

const ICONS = {"晴":"☀️","多云":"⛅","阴":"☁️","小雨":"🌦️","中雨":"🌧️","大雨":"🌧️",
  "暴雨":"🌊","雷阵雨":"⛈️","雪":"🌨️","暴雪":"❄️","雾":"🌫️","霾":"😷",
  "大风":"💨","台风":"🌀","冰雹":"🧊","小雪":"🌨️","中雪":"🌨️","大雪":"❄️",
  "雨夹雪":"🌨️","冻雨":"🧊","沙尘暴":"🌪️","扬沙":"🌫️","龙卷风":"🌪️",
  "高温":"🌡️","寒潮":"🥶","霜冻":"❄️"};

const CONDITIONS = {
  "晴":[1,"天气晴朗，很适合出行。紫外线较强，记得涂防晒霜、戴遮阳帽或墨镜。",""],
  "多云":[2,"适合出行，光线柔和，注意早晚温差。",""],
  "阴":[2,"适合出行，天色偏暗，开车记得打开车灯。",""],
  "小雨":[3,"出门带伞，路面湿滑，步行和骑车都要放慢速度，开车保持车距。","外套和鞋子尽量选防水面料。"],
  "中雨":[3,"带伞，路上注意积水，穿防滑的鞋，开车减速慢行。","外套和鞋子尽量选防水面料，最好多带一双干袜子。"],
  "大雨":[4,"尽量缩短户外时间，避开低洼和积水路段，不要走积水下的电线杆附近。","外套和鞋子尽量选防水面料，撑伞容易被风吹，建议穿带帽的防水外套。"],
  "暴雨":[5,"非必要不外出。远离地下车库、河道、低洼路段，注意积水和内涝预警。","穿防水外套和雨鞋，带好替换衣物，避免全身淋湿。"],
  "雷阵雨":[4,"打雷时远离大树、广告牌、金属栏杆和空旷高地，尽快进入室内，不要在户外停留。","随身带雨具，尽量选不导电的胶鞋。"],
  "雪":[4,"路面结冰湿滑，穿防滑鞋、小步慢走，开车减速并保持长距离，必要时坐公共交通。","加厚外套、防水防滑的鞋，戴好帽子和手套。"],
  "暴雪":[5,"尽量减少外出，注意积雪压塌和能见度降低，开车务必装防滑链或改乘公共交通。","加厚外套、防水防滑的鞋，戴好帽子和手套，多带一件替换衣物。"],
  "雾":[3,"能见度低，开车打开雾灯和近光灯并减速，步行穿亮色衣服让人看见你。",""],
  "霾":[4,"空气质量差，出门戴 N95 口罩，减少户外运动，回家后及时洗手洗脸。","穿长袖长裤减少皮肤暴露，外出回家后换掉外套。"],
  "冰雹":[4,"尽快进入坚固建筑物内躲避，不要在树下和广告牌下停留，车辆停到有遮挡的地方。","戴好帽子保护头部，外套选厚一点的面料。"],
  "小雪":[3,"小雪对出行影响不大，注意路面湿滑，走路小步、开车减速。","穿防滑鞋，戴好帽子和手套。"],
  "中雪":[4,"雪天路滑，尽量坐公共交通，自驾减速并保持车距。","加厚外套和防水防滑的鞋，戴好帽子和手套。"],
  "大雪":[4,"减少外出，开车装防滑链或改乘公共交通，注意树枝和积雪坠落。","加厚外套、防水防滑的鞋，戴好帽子和手套。"],
  "雨夹雪":[4,"雨雪混合，路面容易结冰打滑，穿防滑鞋、开车减速慢行。","防水保暖的外套，雨具和帽子都带上。"],
  "冻雨":[5,"地面会结明冰，尽量别出门；必须出行时小步慢走，开车务必装防滑链。","防水防滑的鞋和厚外套，手套选带防滑纹路的。"]
};

const LEVEL_NAMES = {1:"好",2:"较好",3:"一般",4:"较差",5:"恶劣"};

const BANDS = [
  [-Infinity,-10,"严寒","厚羽绒服 + 加厚保暖内衣 + 棉裤/毛裤 + 雪地靴，帽子、围巾、手套三件套缺一不可。","低温"],
  [-10,0,"寒冷","羽绒服或厚棉服 + 毛衣 + 保暖裤 + 高帮鞋，戴好围巾和手套。","低温"],
  [0,10,"冷","大衣或薄羽绒服 + 毛衣/卫衣 + 长裤，怕冷可以再加一条秋裤。","低温"],
  [10,18,"凉爽","风衣或夹克 + 长袖 T 恤 + 长裤，早晚再备一件薄外套。","舒适"],
  [18,24,"舒适","衬衫或薄长袖 + 长裤，体感最舒服，怎么穿都自在。","舒适"],
  [24,26,"温暖","短袖 + 薄长裤或裙子，选透气吸汗的面料。","舒适"],
  [26,35,"炎热","短袖短裤或连衣裙，浅色透气面料，注意防晒。","高温"],
  [35,Infinity,"酷热","最轻薄的衣物，尽量待在室内，出门做好防晒并及时补水。","高温"]
];

const CATEGORIES = {"低温":"偏冷，注意保暖","舒适":"体感较好，正常穿着即可","高温":"偏热，注意防晒补水"};

const PROVINCE_AREA = {
  "北京":"华北","天津":"华北","河北":"华北","山西":"华北","内蒙古":"华北",
  "辽宁":"东北","吉林":"东北","黑龙江":"东北",
  "上海":"华东","江苏":"华东","浙江":"华东","安徽":"华东","福建":"华东","江西":"华东","山东":"华东",
  "河南":"华中","湖北":"华中","湖南":"华中",
  "广东":"华南","广西":"华南","海南":"华南","香港":"华南","澳门":"华南","台湾":"华南",
  "重庆":"西南","四川":"西南","云南":"西南","贵州":"西南",
  "陕西":"西北","甘肃":"西北","宁夏":"西北","新疆":"西北",
  "西藏":"高原","青海":"高原"
};

const AREA_TIPS = {
  "华北":"华北空气干燥、昼夜温差大，注意补水，早晚加件外套。",
  "东北":"东北昼夜温差大、冬季寒冷，注意早晚添衣，天冷时注意路面结冰。",
  "华东":"华东雨水偏多、湿度大，雨具常备，注意防潮。",
  "华中":"华中夏季闷热、冬季湿冷，注意按季节增减衣物。",
  "华南":"华南高温多雨、台风多发，注意防晒，留意台风预警。",
  "西南":"西南多阴雨、湿度大，随身带伞，注意防潮保暖。",
  "西北":"西北干燥、多风沙，注意补水防晒，风大时戴口罩。",
  "高原":"高原紫外线强、昼夜温差大，防晒和外套都要带。"
};

const WIND_DIRS = ["北","东北","东","东南","南","西南","西","西北"];
const WEEKDAYS = ["日","一","二","三","四","五","六"];

const $ = id => document.getElementById(id);

function conditionName(code){ return WMO[code] || "多云"; }
function iconOf(name){ return ICONS[name] || "⛅"; }
function windText(deg){
  if (deg === null || deg === undefined) return "—";
  return WIND_DIRS[Math.floor(((deg + 22.5) % 360) / 45)] + "风";
}
function aqiLevel(v){
  if (v <= 50) return "优";
  if (v <= 100) return "良";
  if (v <= 150) return "轻度污染";
  if (v <= 200) return "中度污染";
  if (v <= 300) return "重度污染";
  return "严重污染";
}
function bandOf(t){
  for (const [lo, hi, name, cloth, cat] of BANDS){
    if (t >= lo && t < hi) return {name, cloth, cat};
  }
  return {name:"舒适", cloth:BANDS[4][3], cat:"舒适"};
}
function areaOf(admin1){
  if (!admin1) return "";
  for (const p of Object.keys(PROVINCE_AREA)){
    if (admin1.indexOf(p) !== -1) return PROVINCE_AREA[p];
  }
  return "";
}
function dateLabel(iso){
  const d = new Date(iso + "T00:00:00");
  return `${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} 星期${WEEKDAYS[d.getDay()]}`;
}
function timeOf(iso){ return iso ? iso.slice(11,16) : "—"; }

function setToday(){
  const d = new Date();
  $("today").textContent =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${WEEKDAYS[d.getDay()]}`;
}

async function getJSON(url){
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function renderDays(box, rows){
  box.innerHTML = rows.map(d => {
    const name = conditionName(d.code);
    return `<div class="line">
      <span class="d">${dateLabel(d.time)}</span>
      <span class="w">${iconOf(name)} ${name}</span>
      <span class="t">${Math.round(d.tmin*10)/10}~${Math.round(d.tmax*10)/10} ℃</span>
    </div>`;
  }).join("");
}

async function query(city){
  const msg = $("msg");
  msg.innerHTML = '<div class="loading">正在查询…</div>';
  $("result").classList.add("empty");
  const name = city.trim();
  if (!name){ msg.innerHTML = '<div class="err">请输入城市名</div>'; return; }

  try{
    const geo = await getJSON("https://geocoding-api.open-meteo.com/v1/search?name="
      + encodeURIComponent(name) + "&count=1&language=zh&format=json");
    if (!geo.results || !geo.results.length){
      msg.innerHTML = '<div class="err">没找到这个城市，试试输入地级市名，如“杭州”</div>';
      return;
    }
    const g = geo.results[0];
    const q = new URLSearchParams({
      latitude: g.latitude, longitude: g.longitude, timezone: "Asia/Shanghai",
      past_days: "7", forecast_days: "8",
      current: "temperature_2m,weather_code,wind_speed_10m,wind_direction_10m",
      daily: "weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset"
    });

    const [fc, aq] = await Promise.all([
      getJSON("https://api.open-meteo.com/v1/forecast?" + q.toString()),
      getJSON("https://air-quality-api.open-meteo.com/v1/air-quality?latitude="
        + g.latitude + "&longitude=" + g.longitude + "&current=us_aqi,pm2_5&timezone=Asia/Shanghai")
        .catch(() => null)
    ]);

    const daily = fc.daily, cur = fc.current || {};
    const todayIso = new Date().toISOString().slice(0,10);
    let idx = daily.time.findIndex(t => t === todayIso);
    if (idx < 0) idx = 7;

    const cname = conditionName(cur.weather_code !== undefined ? cur.weather_code : daily.weather_code[idx]);
    const temp = Math.round(cur.temperature_2m * 10) / 10;
    const cond = CONDITIONS[cname] || CONDITIONS["多云"];
    const band = bandOf(temp);
    const area = areaOf(g.admin1 || "");
    const aqi = aq && aq.current ? aq.current.us_aqi : null;
    const pm25 = aq && aq.current ? aq.current.pm2_5 : null;

    $("curCity").textContent = g.name || name;
    $("curArea").textContent = area ? `${area} · ${g.admin1}` : (g.admin1 || "");
    $("curIcon").textContent = iconOf(cname);
    $("curTemp").innerHTML = `${temp}<small> ℃</small>`;
    $("curCond").textContent = `${iconOf(cname)} ${cname} · ${band.name}`;
    $("level").textContent = LEVEL_NAMES[cond[0]];
    $("cat").textContent = `${band.cat}（${CATEGORIES[band.cat]}）`;
    $("wind").textContent = (cur.wind_speed_10m === undefined) ? "—"
      : `${windText(cur.wind_direction_10m)} ${Math.round(cur.wind_speed_10m*10)/10} km/h`;
    $("aqi").textContent = aqi === null ? "—"
      : `${aqiLevel(aqi)}（AQI ${Math.round(aqi)}${pm25 !== null ? "，PM2.5 " + Math.round(pm25*10)/10 + " μg/m³" : ""}）`;
    $("sunrise").textContent = "🌅 " + timeOf(daily.sunrise[idx]);
    $("sunset").textContent = "🌇 " + timeOf(daily.sunset[idx]);

    $("cloth").innerHTML = `<b>穿衣建议</b>${band.cloth}`;
    $("travel").textContent = cond[1];
    const tips = [];
    if (cond[2]) tips.push(cond[2]);
    if (band.cat === "低温" && cond[0] <= 3) tips.push("气温偏低，出门注意保暖，尽量减少长时间户外停留。");
    if (band.cat === "高温" && cond[0] <= 3) tips.push("气温偏高，出行多喝水、做好防晒，避开正午时段。");
    if (area && AREA_TIPS[area]) tips.push(AREA_TIPS[area]);
    if (aqi !== null && aqi > 100) tips.push("空气质量偏差，敏感人群减少户外剧烈运动，外出可戴口罩。");
    if (cond[0] === 5) tips.push("天气恶劣，建议非必要不外出。");
    $("tips").innerHTML = tips.join("<br>");

    renderDays($("future"), daily.time.slice(idx + 1, idx + 8).map((t, i) => ({
      time: t, code: daily.weather_code[idx + 1 + i],
      tmax: daily.temperature_2m_max[idx + 1 + i], tmin: daily.temperature_2m_min[idx + 1 + i]
    })));
    renderDays($("past"), daily.time.slice(Math.max(0, idx - 7), idx).map((t, i) => ({
      time: t, code: daily.weather_code[Math.max(0, idx - 7) + i],
      tmax: daily.temperature_2m_max[Math.max(0, idx - 7) + i],
      tmin: daily.temperature_2m_min[Math.max(0, idx - 7) + i]
    })));

    msg.innerHTML = "";
    $("result").classList.remove("empty");
    localStorage.setItem("weather_city", g.name || name);
  }catch (e){
    msg.innerHTML = '<div class="err">查询失败，请检查网络后重试</div>';
  }
}

$("go").addEventListener("click", () => query($("city").value));
$("city").addEventListener("keydown", e => { if (e.key === "Enter") query($("city").value); });

setToday();
const saved = localStorage.getItem("weather_city") || "青岛";
$("city").value = saved;
query(saved);
</script>
</body>
